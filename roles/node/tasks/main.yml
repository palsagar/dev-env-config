- name: Install NodeSource apt key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"

- name: Add NodeSource apt repository for Node {{ node_major }}
  ansible.builtin.deb822_repository:
    name: nodesource
    uris: "https://deb.nodesource.com/node_{{ node_major }}.x"
    suites: nodistro
    components: main
    signed_by: /etc/apt/keyrings/nodesource.asc

# Prefer NodeSource over Ubuntu's older nodejs package.
- name: Pin nodejs to NodeSource
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/nodesource
    mode: "0644"
    content: |
      Package: nodejs
      Pin: origin deb.nodesource.com
      Pin-Priority: 1001

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    update_cache: true
