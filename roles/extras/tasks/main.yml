# Each group is off by default. Turn one on per host in inventory/hosts.yml.
- name: Install texlive and pandoc
  ansible.builtin.apt:
    name: [texlive, texlive-xetex, texlive-fonts-recommended, texlive-plain-generic, pandoc]
  when: extras_texlive | bool

- name: Install emacs
  ansible.builtin.apt:
    name: emacs-nox
  when: extras_emacs | bool

- name: Install PostgreSQL server
  ansible.builtin.apt:
    name: postgresql
  when: extras_postgresql | bool

- name: Install apptainer
  when: extras_apptainer | bool
  block:
    - name: Add apptainer PPA
      ansible.builtin.apt_repository:
        repo: ppa:apptainer/ap

    - name: Install apptainer package
      ansible.builtin.apt:
        name: apptainer

- name: Install kubectl and minikube
  when: extras_kubernetes | bool
  block:
    - name: Install Kubernetes apt key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes.asc
        mode: "0644"

    - name: Add Kubernetes apt repository
      ansible.builtin.deb822_repository:
        name: kubernetes
        uris: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor }}/deb/"
        suites: /
        signed_by: /etc/apt/keyrings/kubernetes.asc

    - name: Install kubectl
      ansible.builtin.apt:
        name: kubectl
        update_cache: true

    - name: Install minikube
      ansible.builtin.get_url:
        url: "https://storage.googleapis.com/minikube/releases/latest/minikube-linux-{{ arch.minikube }}"
        dest: /usr/local/bin/minikube
        mode: "0755"
