- name: Install Docker apt key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    signed_by: /etc/apt/keyrings/docker.asc

# Keeps apt upgrades inside the pinned major version.
- name: Pin Docker to major version {{ docker_major }}
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/docker
    mode: "0644"
    content: |
      Package: docker-ce docker-ce-cli
      Pin: version 5:{{ docker_major }}.*
      Pin-Priority: 1001

- name: Install Docker Engine, buildx and compose
  ansible.builtin.apt:
    update_cache: true
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

- name: Write Docker daemon config
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: "{{ config | to_nice_json }}\n"
  vars:
    config: >-
      {{ {'log-driver': 'local'}
         | combine({'data-root': data_disk_mount ~ '/docker'} if data_disk_device | length > 0 else {}) }}
  notify: Restart docker

- name: Read docker group members
  ansible.builtin.command: getent group docker
  register: docker_group
  changed_when: false

# gpasswd edits /etc/group only, so it also works for GCP OS Login users, who are
# not in /etc/passwd (ansible.builtin.user would create a local duplicate).
- name: Add the dev user to the docker group
  ansible.builtin.command: gpasswd -a {{ dev_user }} docker
  when: dev_user not in docker_group.stdout.split(':')[3].split(',')
  changed_when: true

# Tagged so tests/container-test.sh can skip it: containers have no systemd.
- name: Enable Docker service
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  tags: [docker_service]
